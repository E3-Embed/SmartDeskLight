name: Firmware build

on:
  push:
    branches: [main]
    paths: ['firmware/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['firmware/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  sensor-host-tests:
    name: Sensor host tests (Arduino ${{ matrix.arduino }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arduino: [2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Compile current production source against hardware mocks
        run: >-
          g++ -std=c++14 -Wall -Wextra -Werror
          -DESP_ARDUINO_VERSION_MAJOR=${{ matrix.arduino }}
          -Itests/sensor_node_host -Ifirmware/sensor_node/include -Ifirmware/common
          tests/sensor_node_host/test.cpp -o /tmp/sensor-tests
      - name: Run sensor and communication tests
        run: /tmp/sensor-tests
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [sensor_node, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/**/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Use placeholder secrets (CI only)
        if: matrix.project == 'gateway'
        run: cp firmware/gateway/include/secrets.example.h firmware/gateway/include/secrets.h

      - name: Build
        run: pio run -d firmware/${{ matrix.project }}
