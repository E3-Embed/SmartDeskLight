name: dashboard image

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-image.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-image.yml"
  workflow_dispatch:

# Publish to GHCR with the workflow's own token — no repository secrets needed.
# The first push creates a private package; make it public under
# GitHub → Packages → smartdesklight-dashboard → Settings if the server should
# pull without credentials.
permissions:
  contents: read
  packages: write

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/e3-embed/smartdesklight-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Pull requests only build, so they never need registry credentials.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=SmartDeskLight dashboard
            org.opencontainers.image.description=Next.js dashboard for the SmartDeskLight ESP32 desk lamp
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Dashboard image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "Pushed: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          } >> "$GITHUB_STEP_SUMMARY"
