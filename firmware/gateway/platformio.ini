[env:gateway]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800            ; native USB is fussy above this
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1  ; uncomment if you flash over the S3's own USB port
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.0
    pololu/VL53L0X @ ^1.3.1
    adafruit/Adafruit NeoPixel @ ^1.12.0   ; on-board RGB status LED (GPIO48)
; INA219: own register-level I2C driver in src/ina219.cpp (E8)