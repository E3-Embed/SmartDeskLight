[env:sensor_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../common
; No external libraries: BH1750 and TCS34725 use our own register-level I2C drivers (E8).
; (Adafruit BusIO fails to find SPI.h with Arduino-ESP32 3.x, so the Adafruit TCS34725 library is not used.)
