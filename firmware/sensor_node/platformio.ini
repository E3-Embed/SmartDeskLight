[env:sensor_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../common
; deep+ lets the library finder see SPI.h used inside Adafruit BusIO
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit TCS34725
; BH1750: own register-level I2C driver (E8) — no library on purpose
