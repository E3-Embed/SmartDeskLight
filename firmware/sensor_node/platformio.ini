[env:sensor_node]
platform = espressif32
; Same board as the gateway: ESP32-S3-DevKitC-1 (on-board WS2812 on GPIO48).
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800            ; native USB is fussy above this
build_flags =
    -I../common
    -DARDUINO_USB_CDC_ON_BOOT=1  ; uncomment if you flash over the S3's own USB port
; BH1750 and TCS34725 use our own register-level I2C drivers (E8), so no sensor library.
; (Adafruit BusIO fails to find SPI.h with Arduino-ESP32 3.x, so the Adafruit TCS34725 library is not used.)
; The status pixel is the same WS2812 driver the gateway uses.
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
